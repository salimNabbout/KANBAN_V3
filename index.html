<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM — Prospecção</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM CETEM">
<meta name="theme-color" content="#E30613">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#C9C5BB;--surface:#DCD9D0;--surface2:#C4C0B6;--surface3:#B8B4AA;
  --text:#1C1917;--text2:#6E6862;--text3:#8C857D;
  --border:#C0BCB3;--border2:#A8A49B;
  --accent:#E30613;--accent-fg:#FFFFFF;--accent-dark:#B30410;--brand-black:#1A1A1A;
  --blue:#2563EB;--blue-bg:#EFF6FF;--blue-mid:#BFDBFE;--blue-light:#DBEAFE;
  --amber:#D97706;--amber-bg:#FFFBEB;--amber-mid:#FDE68A;
  --green:#16A34A;--green-bg:#F0FDF4;--green-mid:#BBF7D0;
  --red:#DC2626;--red-bg:#FEF2F2;--red-mid:#FECACA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-mid:#DDD6FE;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
  --shadow:0 1px 2px rgba(0,0,0,0.04),0 1px 1px rgba(0,0,0,0.025);
  --shadow-md:0 3px 12px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.035);
  --shadow-lg:0 18px 36px rgba(0,0,0,0.10),0 6px 14px rgba(0,0,0,0.05);
  --topbar-h:68px;
}
html.dark{
  --bg:#111110;--surface:#1A1917;--surface2:#222120;--surface3:#2A2927;
  --text:#F5F3EF;--text2:#9C968F;--text3:#655F59;
  --border:#2A2824;--border2:#38342E;
  --accent:#EF3340;--accent-fg:#FFFFFF;--accent-dark:#C42029;--brand-black:#F5F3EF;
  --blue:#3B82F6;--blue-bg:#1A2A44;--blue-mid:#1E3A5F;--blue-light:#162338;
  --amber:#F59E0B;--amber-bg:#281F00;--amber-mid:#3D2E00;
  --green:#22C55E;--green-bg:#0C2416;--green-mid:#14391F;
  --red:#F87171;--red-bg:#280C0C;--red-mid:#3D1010;
  --purple:#A78BFA;--purple-bg:#1C1038;--purple-mid:#2D1A5C;
}
html.dark *{font-weight:400}
@media(prefers-color-scheme:dark){html:not(.light){
  --bg:#111110;--surface:#1A1917;--surface2:#222120;--surface3:#2A2927;
  --text:#F5F3EF;--text2:#9C968F;--text3:#655F59;
  --border:#2A2824;--border2:#38342E;
  --accent:#EF3340;--accent-fg:#FFFFFF;--accent-dark:#C42029;--brand-black:#F5F3EF;
  --blue:#3B82F6;--blue-bg:#1A2A44;--blue-mid:#1E3A5F;--blue-light:#162338;
  --amber:#F59E0B;--amber-bg:#281F00;--amber-mid:#3D2E00;
  --green:#22C55E;--green-bg:#0C2416;--green-mid:#14391F;
  --red:#F87171;--red-bg:#280C0C;--red-mid:#3D1010;
  --purple:#A78BFA;--purple-bg:#1C1038;--purple-mid:#2D1A5C;
}}
@media(prefers-color-scheme:dark){html:not(.light) *{font-weight:400}}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* Topbar */
#topbar-wrap{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:box-shadow 0.2s}
#topbar-wrap.scrolled{box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:0 1.5rem;height:var(--topbar-h);flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:11px}
.brand-icon{height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-icon img{height:46px;width:auto;display:block;object-fit:contain}
.brand-icon svg{width:42px;height:42px;display:block}
.brand-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;color:var(--brand-black);letter-spacing:-0.3px;text-transform:uppercase}
.brand-text .b-red{color:var(--accent)}
.brand-sub{font-size:11px;color:var(--text3);font-weight:500;margin-top:2px;letter-spacing:0.3px}
.topbar-actions{display:flex;gap:8px;align-items:center}
/* Menu overflow (...) para acoes secundarias da topbar */
.overflow-menu-wrap{position:relative}
.overflow-menu-btn{padding:7px 12px;font-size:18px;line-height:1;font-weight:700;letter-spacing:2px;color:var(--text2)}
.overflow-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:120}
.overflow-menu.open{display:block;animation:slideDown 0.14s ease}
.overflow-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:transparent;border:none;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);text-align:left;font-weight:500}
.overflow-item:hover{background:var(--surface2)}
.overflow-ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.overflow-ic svg{width:16px;height:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap;line-height:1}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(0.97)}
.btn svg{width:14px;height:14px;flex-shrink:0;color:var(--btn-ic,currentColor)}
.btn.primary svg{color:currentColor}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 1px 4px rgba(227,6,19,0.25);font-weight:600}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);box-shadow:0 3px 10px rgba(227,6,19,0.32)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.active{background:var(--surface);border-color:var(--border2);box-shadow:inset 0 1px 2px rgba(0,0,0,0.06)}
.view-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:3px;gap:2px}
.view-toggle .btn{padding:5px 12px;border:none;background:transparent;border-radius:8px;font-size:12px}
.view-toggle .btn.active{background:var(--surface);box-shadow:var(--shadow)}

/* Main content */
#app{max-width:1180px;margin:0 auto;padding:2rem 1.5rem}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem}
@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}}
/* Metricas compactas: icon + label + value em uma linha, altura ~54px */
.metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow 0.2s,transform 0.2s;display:flex;align-items:center;gap:12px;min-height:54px}
.metric:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.metric-accent{position:absolute;top:0;left:0;bottom:0;width:3px;height:auto;right:auto;border-radius:0}
.metric.m-total .metric-accent{background:linear-gradient(180deg,#E30613 0%,#1A1A1A 100%)}
.metric.m-stages .metric-accent{background:linear-gradient(180deg,#3B82F6 0%,#7C3AED 100%)}
.metric.m-today .metric-accent{background:linear-gradient(180deg,#F59E0B 0%,#EF4444 100%)}
.metric.m-pipeline .metric-accent{background:linear-gradient(180deg,#16A34A 0%,#0D9488 100%)}
.metric-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:0;flex-shrink:0}
.metric-icon svg{width:15px;height:15px}
.mi-total{background:var(--surface2);color:var(--text2)}
.mi-stages{background:var(--blue-bg);color:var(--blue)}
.mi-today{background:var(--amber-bg);color:var(--amber)}
.mi-pipeline{background:var(--green-bg);color:var(--green)}
.metric-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.metric-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px}
.metric-value{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;color:var(--text);line-height:1.05;margin-bottom:1px}
.metric-value.sm{font-size:14px;padding-top:0}
.metric-sub{font-size:10.5px;color:var(--text3);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Alert */
.alert{display:flex;align-items:center;gap:10px;background:var(--amber-bg);border:1px solid var(--amber-mid);border-radius:var(--radius);padding:11px 15px;margin-bottom:1.25rem;font-size:13px;color:var(--amber);font-weight:500;animation:slideDown 0.2s ease}
.alert svg{width:16px;height:16px;flex-shrink:0}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* Filters */
.filters{display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none}
.search-wrap input{width:100%;padding:9px 12px 9px 35px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color 0.15s,box-shadow 0.15s;box-shadow:var(--shadow)}
.search-wrap input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.filters select{padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);cursor:pointer;box-shadow:var(--shadow);transition:border-color 0.15s}
.filters select:focus{outline:none;border-color:var(--blue)}

/* Kanban */
/* Kanban usa flex para permitir larguras proporcionais ao numero de cards */
.kanban{display:flex;gap:14px;align-items:stretch;flex-wrap:nowrap;overflow-x:auto}
.kanban .col{flex:1 1 0;min-width:200px;max-width:380px}
@media(max-width:700px){.kanban{flex-wrap:wrap}.kanban .col{min-width:100%;max-width:100%}}
.col{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xl);padding:14px;min-height:300px}
.col-lead{border-top:3px solid var(--blue)}
.col-contato{border-top:3px solid var(--amber)}
.col-quali{border-top:3px solid var(--green)}
.col-reuniao{border-top:3px solid var(--purple)}
.col-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);position:relative;cursor:help}
.col-head[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 4px);left:0;right:0;background:transparent;color:var(--text);padding:4px 0;font-size:11.5px;font-weight:500;font-style:italic;z-index:80;line-height:1.35;pointer-events:none;white-space:normal}
.col-head[data-tip=""]:hover::after{display:none}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-lead{background:var(--blue)}
.dot-contato{background:var(--amber)}
.dot-quali{background:var(--green)}
.dot-reuniao{background:var(--purple)}
.col-name{font-size:13px;font-weight:600;color:var(--text);flex:1}
.col-count{font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:2px 9px;color:var(--text2)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--card-c,var(--border));border-radius:10px;padding:8px 10px 8px 9px;margin-bottom:6px;cursor:pointer;transition:all 0.18s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card:active{transform:translateY(0);box-shadow:var(--shadow)}
.card:last-child{margin-bottom:0}
/* Variante compacta do Kanban: apenas nome + empresa visíveis, sem margens extras */
.card.card-compact{padding:7px 10px 7px 9px}
.card.card-compact .card-header{margin-bottom:0}
.card-badge-desq{color:var(--red);background:var(--red-bg);font-size:11px;font-weight:700;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:6px}
.card-avatar{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;letter-spacing:0.3px}
.av-blue{background:var(--blue-bg);color:var(--blue)}
.av-amber{background:var(--amber-bg);color:var(--amber)}
.av-green{background:var(--green-bg);color:var(--green)}
.av-purple{background:var(--purple-bg);color:var(--purple)}
.av-red{background:var(--red-bg);color:var(--red)}
.card-info{flex:1;min-width:0}
.card-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;line-height:1.2}
.card-empresa{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.card-divider{height:1px;background:var(--border);margin:5px 0}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card-val{font-size:11.5px;font-weight:600;color:var(--text2)}
.date-badge{font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:99px}
.date-ok{background:var(--green-bg);color:var(--green)}
.date-today{background:var(--amber-bg);color:var(--amber)}
.date-late{background:var(--red-bg);color:var(--red)}
.date-none{color:var(--text3);font-size:10.5px}
.move-btns{display:flex;gap:4px;margin-top:6px}
.move-btn{font-size:10.5px;font-weight:500;padding:3px 8px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:3px}
.move-btn:hover{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.card[draggable="true"]{cursor:grab}
.card[draggable="true"]:active{cursor:grabbing}
.card.dragging{opacity:0.4;transform:rotate(-2deg) scale(0.98);box-shadow:0 12px 30px rgba(227,6,19,0.25)}
.col.col-drop{background:rgba(227,6,19,0.06);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;transition:all 0.12s}
.list-group.col-drop{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;background:rgba(227,6,19,0.05)}
.list-group tr[draggable="true"]{cursor:grab}
.list-group tr.dragging{opacity:0.4}
.col.col-drop .col-head{border-bottom-color:var(--accent)}
.empty-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1rem;color:var(--text3)}
.empty-col svg{width:28px;height:28px;margin-bottom:8px;opacity:0.35}
.empty-col span{font-size:13px}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2)}
th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background 0.12s;cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
.td-name{font-weight:600}
.td-company{color:var(--text2)}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-lead{background:var(--blue-bg);color:var(--blue)}
.badge-lead::before{background:var(--blue)}
.badge-contato{background:var(--amber-bg);color:var(--amber)}
.badge-contato::before{background:var(--amber)}
.badge-quali{background:var(--green-bg);color:var(--green)}
.badge-quali::before{background:var(--green)}
.badge-reuniao{background:var(--purple-bg);color:var(--purple)}
.badge-reuniao::before{background:var(--purple)}
.badge.dyn{background:var(--c-bg);color:var(--c)}
.badge.dyn::before{background:var(--c)}
.td-hist{font-size:12px;color:var(--text3)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:300;padding:1rem;animation:fadeIn 0.18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius-xl);padding:0;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:slideUp 0.22s cubic-bezier(0.34,1.2,0.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(18px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-top{padding:22px 24px 0;border-bottom:1px solid var(--border)}
.modal-top h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;color:var(--text);margin-bottom:14px;letter-spacing:-0.3px}
.tabs{display:flex;gap:0}
.tab{padding:9px 18px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.modal-body{padding:22px 24px}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.field input,.field select,.field textarea{width:100%;padding:9px 13px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);transition:border-color 0.15s,box-shadow 0.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px var(--blue-light)}
.field textarea{height:76px;resize:vertical}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.modal-row{grid-template-columns:1fr}}
.modal-footer{display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--border);justify-content:flex-end;background:var(--surface2);border-radius:0 0 var(--radius-xl) var(--radius-xl);flex-wrap:wrap;align-items:center}
.del-btn{margin-right:auto;color:var(--red);border-color:var(--red-mid);background:transparent}
.del-btn:hover{background:var(--red-bg)}

/* History */
.hist-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.hist-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;transition:border-color 0.15s}
.hist-item:hover{border-color:var(--border2)}
.hist-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.hist-date{font-size:11px;color:var(--text3);margin-left:auto}
.hist-del{font-size:11px;color:var(--red);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;font-weight:500;opacity:0.7}
.hist-del:hover{opacity:1;text-decoration:underline}
.hist-texto{font-size:13px;color:var(--text);line-height:1.55}

<script>
const DEFAULT_STAGES=[
  {name:'A fazer',short:'A fazer',color:'#2563EB',desc:'Potencial Cliente a ser Trabalhado'},
  {name:'Fazendo',short:'Fazendo',color:'#D97706',desc:'Aceitou o Convite no Sales Navigation'},
  {name:'Em espera',short:'Em espera',color:'#16A34A',desc:'Aceitou Agendar uma Reunião'},
  {name:'Concluído',short:'Concluído',color:'#7C3AED',desc:'Missão Cumprida pelo Gerente de Relacionamento'}
];
let stagesConfig=JSON.parse(JSON.stringify(DEFAULT_STAGES));
let STAGES=stagesConfig.map(s=>s.name);
function refreshStages(){STAGES=stagesConfig.map(s=>s.name)}
function stageObj(name){return stagesConfig.find(s=>s.name===name)||DEFAULT_STAGES[0]}
function stageColor(name){return stageObj(name).color}
function stageShort(name){return (stagesConfig.find(s=>s.name===name)||{short:name}).short}
function stageDesc(name){const s=stagesConfig.find(x=>x.name===name);if(s&&typeof s.desc==='string')return s.desc;const d=DEFAULT_STAGES.find(x=>x.name===name);return d?d.desc:''}
function hex2rgba(hex,a){if(!hex||hex[0]!=='#')return`rgba(120,113,108,${a})`;const n=parseInt(hex.slice(1),16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
function badgeStyle(name){const c=stageColor(name);return`background:${hex2rgba(c,0.12)};color:${c}`}
function dotStyle(name){return`background:${stageColor(name)}`}

function sbHdr(extra){

function handleAuthError(e){

    session=null;
    try{showLogin()}catch{}
    toast('Sessao expirada - faca login novamente','error');

}

async function dbFetch(){
  try{
    const r=await fetch(`${SB_API}?select=*`,{headers:sbHdr()});
    if(!r.ok)throw new Error(await r.text());
    const data=await r.json();
    const rows=data.map(p=>({...p,historico:Array.isArray(p.historico)?p.historico:[]}));
    localStorage.setItem('crm_v2',JSON.stringify(rows));
    return rows;
  }catch(e){
    console.warn('Supabase offline, usando cache local:',e.message);
    try{return JSON.parse(localStorage.getItem('crm_v2')||'[]')}catch{return[]}
  }
}

function icpScore(p){
  if(!p)return 0;
  let score=0;
  if(p.setor&&icpConfig.setoresPrioritarios.includes(p.setor))score+=40;
  else if(p.setor)score+=15;
  if(p.porte){
    const port=DEFAULT_PORTES.find(pt=>pt.label===p.porte);
    if(port)score+=port.pts;
    if(icpConfig.portesPrioritarios.includes(p.porte))score+=20;
  }
  // bonus se tem decisor identificado
  if(p.contato)score+=10;
  // bonus se tem email corporativo
  if(p.email&&!p.email.match(/@(gmail|hotmail|yahoo|outlook|live|bol|uol|terra)\./i))score+=10;
  return Math.min(100,score);
}

function computeSuggestions(){
  const sugs=[];
  const now=new Date();
  prospects.filter(p=>!p.desqualificado&&p.stage!==LAST_STAGE()).forEach(p=>{
    // 1. Próxima ação da cadência vencida ou hoje
    const nc=nextCadenceStep(p);
    if(nc&&nc.daysUntil<=0){
      sugs.push({p,tipo:'cadencia',prioridade:nc.daysUntil<0?3:2,msg:`${nc.tipo} — ${nc.acao}`,sub:nc.daysUntil<0?`Atrasado ${-nc.daysUntil}d`:'Hoje'});
    }
    // 2. Dormente 14+ dias
    const hist=(p.historico||[]).slice().sort((a,b)=>(b.data+(b.hora||'')).localeCompare(a.data+(a.hora||'')));
    if(hist.length){
      const last=hist[0];
      const lastDate=new Date(last.data+'T'+(last.hora||'00:00'));
      const daysStuck=Math.floor((now-lastDate)/86400000);
      if(daysStuck>=14&&(!nc||nc.daysUntil>0)){
        sugs.push({p,tipo:'dormente',prioridade:3,msg:'Reativar com mensagem de retomada',sub:`${daysStuck}d sem atividade`});
      }
    }
    // 3. Sem BANT marcado mas está em etapa avançada
    const stageIdx=STAGES.indexOf(p.stage);
    const bs=bantScore(p);
    if(stageIdx>=2&&bs===0){
      sugs.push({p,tipo:'qualificar',prioridade:2,msg:'Qualificar BANT',sub:'Etapa avançada sem qualificação'});
    }
    // 4. Qualificado mas ainda não avançou
    if(bs>=75&&stageIdx<STAGES.length-1){
      sugs.push({p,tipo:'avancar',prioridade:1,msg:`Avançar para "${STAGES[stageIdx+1]}"`,sub:`BANT ${bs}/100 · pronto para reunião`});
    }
    // 5. Próximo contato hoje sem interação hoje
    const tYmd=today();
    if(p.proximoContato===tYmd){
      const hojeInter=(p.historico||[]).filter(h=>h.data===tYmd&&['Ligação','E-mail','Reunião','Nota'].includes(h.tipo)).length;
      if(!hojeInter)sugs.push({p,tipo:'agendado',prioridade:3,msg:'Executar contato agendado',sub:'Próximo contato marcado para hoje'});
    }
  });
  return sugs.sort((a,b)=>b.prioridade-a.prioridade).slice(0,12);
}
function nextCadenceStep(p){
  if(!p||p.desqualificado||p.stage===LAST_STAGE())return null;
  const criado=p.criadoEm||today();
  const d1=new Date(criado);
  const today_d=new Date();today_d.setHours(0,0,0,0);
  const daysSince=Math.floor((today_d-d1)/86400000);
  const hist=(p.historico||[]).filter(h=>['Ligação','E-mail','Reunião','Nota'].includes(h.tipo));
  const countByType={};
  hist.forEach(h=>{countByType[h.tipo]=(countByType[h.tipo]||0)+1});
  // Encontra próximo passo ainda não executado
  for(const step of cadenciaConfig){
    const tipoMatch=step.tipo==='WhatsApp'?'Ligação':(step.tipo==='LinkedIn'?'Nota':step.tipo);
    const stepsBefore=cadenciaConfig.filter(s=>s.dia<=step.dia&&s.tipo===step.tipo).length;
    const executed=(countByType[tipoMatch]||0);
    if(executed<stepsBefore)return {...step,daysSinceStart:daysSince,daysUntil:step.dia-daysSince};
  }
  return null;
}
function weekStartYmd(){
  const d=new Date();
  const day=d.getDay();
  const diff=day===0?6:day-1; // segunda=0
  d.setDate(d.getDate()-diff);d.setHours(0,0,0,0);
  return ymd(d);
}
function weekEndYmd(){
  const d=new Date();
  const day=d.getDay();
  const diff=day===0?0:7-day;
  d.setDate(d.getDate()+diff);d.setHours(23,59,59,999);
  return ymd(d);
}
function computePeriodTotals(startYmd,endYmd){
  const evs=allEvents().filter(e=>e.data&&e.data>=startYmd&&e.data<=endYmd);
  const last=LAST_STAGE();

async function sendTemplate(tplId){
  const tpl=templatesConfig.find(t=>t.id===tplId);
  if(!tpl||!modal)return;
  const text=fillTemplate(tpl.texto,modal);
  document.getElementById('tpl-menu')?.remove();
  if(tpl.tipo==='WhatsApp'){
    const link=waLink(modal.telefone,text);
    if(!link){toast('Telefone não preenchido','error');return}
    window.open(link,'_blank','noopener');
    await logInteracao('Ligação','Enviou WhatsApp: '+tpl.nome);
  } else if(tpl.tipo==='E-mail'){
    if(!modal.email){toast('E-mail não preenchido','error');return}
    let subject='',body=text;
    const mt=text.match(/^Assunto:\s*([^\n]+)\n+([\s\S]*)$/);
    if(mt){subject=mt[1].trim();body=mt[2].trim()}
    // Auto-append da assinatura se template não contiver {{assinatura}} e auto estiver ligado
    if(signatureConfig.autoAppend&&!tpl.texto.includes('{{assinatura}}')){
      const seuNome=(currentUser()||'').split('@')[0];
      const sig=String(signatureConfig.texto||'').replace(/\{\{seuNome\}\}/g,seuNome);
      if(sig.trim())body=body+'\n\n'+sig;
    }
    // Copia assunto + corpo formatados para o clipboard (fallback se Outlook não formatar certo)
    try{await navigator.clipboard.writeText(`Assunto: ${subject}\n\n${body}`)}catch{}
    // Abre Outlook Web com dados pré-preenchidos (to/subject funciona, body pode vir com + em algumas versões)
    const link=`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(modal.email)}&subject=${encodeURIComponent(subject)}`;
    window.open(link,'_blank','noopener');
    toast('E-mail aberto · corpo copiado (Ctrl+V caso precise)');
    await logInteracao('E-mail','Enviou e-mail: '+tpl.nome);
  } else if(tpl.tipo==='LinkedIn'){
    try{await navigator.clipboard.writeText(text);toast('Mensagem copiada — cole no LinkedIn')}
    catch{toast('Copie manualmente o texto','error')}
    await logInteracao('Nota','Mensagem LinkedIn enviada: '+tpl.nome);
  } else {
    try{await navigator.clipboard.writeText(text);toast('Script copiado')}catch{}
  }
}

let _savingModal=false;
async function saveModal(){
  if(_savingModal)return;
  if(!modal.nome.trim()){toast('Nome e obrigatorio','error');return}
  if(modal.desqualificado&&!modal.motivoDesqualificacao){toast('Selecione o motivo da desqualificacao','error');return}
  const record={...modal,id:editId||uid(),criadoEm:modal.criadoEm||today()};
  if(!editId){
    const entry={id:uid(),data:today(),hora:nowHHMM(),tipo:'Criação',texto:`Prospecto criado na etapa "${record.stage}"`,auto:true,user:currentUser()};
    record.historico=[entry,...(record.historico||[])];
  } else {
    const prev=prospects.find(p=>p.id===editId);
    if(prev&&prev.stage!==record.stage){
      const entry={id:uid(),data:today(),hora:nowHHMM(),tipo:'Movimentação',texto:`${prev.stage} → ${record.stage}`,auto:true,user:currentUser()};
      record.historico=[entry,...(record.historico||[])];
    }
    if(prev&&!prev.desqualificado&&record.desqualificado){
      const entry={id:uid(),data:today(),hora:nowHHMM(),tipo:'Nota',texto:`✕ DESQUALIFICADO — motivo: ${record.motivoDesqualificacao}`,auto:true,user:currentUser()};
      record.historico=[entry,...(record.historico||[])];
    } else if(prev&&prev.desqualificado&&!record.desqualificado){
      const entry={id:uid(),data:today(),hora:nowHHMM(),tipo:'Nota',texto:`↻ Prospecto reativado`,auto:true,user:currentUser()};
      record.historico=[entry,...(record.historico||[])];
    }
  }
  _savingModal=true;
  document.querySelectorAll('#modal-overlay .modal-footer .btn').forEach(b=>b.disabled=true);
  try{
    await dbUpsert(record);
    if(editId){prospects=prospects.map(p=>p.id===editId?record:p)}else{prospects=[...prospects,record]}
    localStorage.setItem('crm_v2',JSON.stringify(prospects));
    closeModal();renderFull();toast('Prospecto salvo com sucesso');
  }catch(e){
    if(!handleAuthError(e))toast('Erro ao salvar: '+e.message,'error');
    document.querySelectorAll('#modal-overlay .modal-footer .btn').forEach(b=>b.disabled=false);
  }finally{_savingModal=false}
}
async function deleteProspect(){
  if(_savingModal)return;
  if(!editId)return;
  if(!confirm('Excluir este prospecto?'))return;
  _savingModal=true;
  document.querySelectorAll('#modal-overlay .modal-footer .btn').forEach(b=>b.disabled=true);
  try{
    await dbDelete(editId);
    prospects=prospects.filter(p=>p.id!==editId);
    localStorage.setItem('crm_v2',JSON.stringify(prospects));
    closeModal();renderFull();toast('Prospecto excluído');
  }catch(e){
    if(!handleAuthError(e))toast('Erro ao excluir: '+e.message,'error');
    document.querySelectorAll('#modal-overlay .modal-footer .btn').forEach(b=>b.disabled=false);
  }finally{_savingModal=false}
}
function nowHHMM(){const d=new Date();return`${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function currentUser(){return session?.user?.email||'Sistema'}
function moveAllowed(fromStage,toStage){
  const fi=STAGES.indexOf(fromStage),ti=STAGES.indexOf(toStage);
  if(fi<0||ti<0)return true;
  if(ti>fi)return true;
  if(fi===STAGES.length-2&&ti===fi-1)return true;
  return false;
}
async function moveToStage(id,newStage){
  const p=prospects.find(x=>x.id===id);if(!p||p.stage===newStage)return;
  if(!moveAllowed(p.stage,newStage)){
    toast(`Movimento não permitido. Cards só avançam (→). Só "${STAGES[STAGES.length-2]}" pode voltar um passo para "${STAGES[1]}".`,'error');
    renderContent();return;
  }
  const oldStage=p.stage;
  const entry={id:uid(),data:today(),hora:nowHHMM(),tipo:'Movimentação',texto:`${oldStage} → ${newStage}`,auto:true,user:currentUser()};
  const newHist=[entry,...(p.historico||[])];
  const updated={...p,stage:newStage,historico:newHist};
  prospects=prospects.map(x=>x.id===id?updated:x);
  renderContent();
  try{
    await dbPatch(id,{stage:newStage,historico:newHist});
    localStorage.setItem('crm_v2',JSON.stringify(prospects));
  }catch(e){
    prospects=prospects.map(x=>x.id===id?p:x);
    renderContent();toast('Erro ao mover: '+e.message,'error');
  }
}
async function moveStage(id,dir,e){
  if(e)e.stopPropagation();
  const p=prospects.find(x=>x.id===id);if(!p)return;
  const i=STAGES.indexOf(p.stage);const ni=i+dir;
  if(ni<0||ni>=STAGES.length)return;
  await moveToStage(id,STAGES[ni]);
}
let dragId=null;
function dragStart(e,id){
  dragId=id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',id);
  setTimeout(()=>{const el=document.querySelector(`[data-card-id="${id}"]`);if(el)el.classList.add('dragging')},0);
}
function dragEnd(){
  document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.col-drop').forEach(el=>el.classList.remove('col-drop'));
  dragId=null;
}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move'}
function dragEnter(e){e.currentTarget.classList.add('col-drop')}
function dragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('col-drop')}
function dropOnCol(e,stage){
  e.preventDefault();
  e.currentTarget.classList.remove('col-drop');
  const id=dragId||e.dataTransfer.getData('text/plain');
  if(id)moveToStage(id,stage);
}
function dropOnColEl(e,colEl){
  e.preventDefault();
  colEl.classList.remove('col-drop');
  const id=dragId||e.dataTransfer.getData('text/plain');
  const stage=colEl?.dataset?.stage;
  if(id&&stage)moveToStage(id,stage);
}
function setField(k,v){modal={...modal,[k]:v}}
function setView(v){view=v;renderTopbar();renderContent()}
function pad2(n){return String(n).padStart(2,'0')}
function buildICS(p){
  if(!p.proximoContato)return null;
  const [Y,M,D]=p.proximoContato.split('-');
  const now=new Date();
  const dtStamp=`${now.getUTCFullYear()}${pad2(now.getUTCMonth()+1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
  const hora=(p.horaContato||'').trim();
  let dtLines;
  if(/^\d{2}:\d{2}$/.test(hora)){
    const [h,m]=hora.split(':');
    const start=new Date(+Y,+M-1,+D,+h,+m);
    const end=new Date(start.getTime()+60*60*1000);
    const fmt=d=>`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
    dtLines=`DTSTART:${fmt(start)}\r\nDTEND:${fmt(end)}`;
  } else {
    const next=new Date(+Y,+M-1,+D);next.setDate(next.getDate()+1);
    const fmtD=d=>`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
    dtLines=`DTSTART;VALUE=DATE:${Y}${M}${D}\r\nDTEND;VALUE=DATE:${fmtD(next)}`;
  }
  const escIcs=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[\n\r]+/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
  const summary=escIcs(`Reunião — ${p.empresa||p.nome||'Prospecto'}`);
  const descParts=[];
  if(p.nome)descParts.push(`Contato: ${p.nome}`);
  if(p.contato)descParts.push(`Cargo: ${p.contato}`);
  if(p.email)descParts.push(`E-mail: ${p.email}`);
  if(p.telefone)descParts.push(`Telefone: ${p.telefone}`);
  if(p.valor)descParts.push(`Valor estimado: R$ ${Number(p.valor).toLocaleString('pt-BR')}`);
  if(p.notas)descParts.push('',p.notas);
  const description=escIcs(descParts.join('\n'));
  const location=escIcs(p.empresa||'');
  const uid=`${p.id||uid()}@cetem-crm`;
  return [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CETEM Automacao//CRM Prospeccao//PT',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:${uid}`,`DTSTAMP:${dtStamp}`,dtLines,
    `SUMMARY:${summary}`,`DESCRIPTION:${description}`,`LOCATION:${location}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
}
function openOutlookEvent(){
  const p=modal;
  if(!p.proximoContato){toast('Defina uma data em "Próximo contato" antes','error');return}
  const [Y,M,D]=p.proximoContato.split('-');
  const hora=(p.horaContato||'').trim();
  let startISO,endISO;
  if(/^\d{2}:\d{2}$/.test(hora)){
    const [h,m]=hora.split(':');
    const start=new Date(+Y,+M-1,+D,+h,+m);
    const end=new Date(start.getTime()+60*60*1000);
    const fmt=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
    startISO=fmt(start);endISO=fmt(end);
  } else {
    startISO=`${Y}-${M}-${D}T09:00:00`;
    endISO=`${Y}-${M}-${D}T10:00:00`;
  }
  const subject=`Reunião — ${p.empresa||p.nome||'Prospecto'}`;
  const bodyParts=[];
  if(p.nome)bodyParts.push(`Contato: ${p.nome}`);
  if(p.contato)bodyParts.push(`Cargo: ${p.contato}`);
  if(p.telefone)bodyParts.push(`Telefone: ${p.telefone}`);
  if(p.email)bodyParts.push(`E-mail: ${p.email}`);
  if(p.valor)bodyParts.push(`Valor estimado: R$ ${Number(p.valor).toLocaleString('pt-BR')}`);
  if(p.notas)bodyParts.push('','Notas:',p.notas);
  const body=bodyParts.join('\n');
  const enc=s=>encodeURIComponent(String(s||''));
  const parts=[
    'path=%2Fcalendar%2Faction%2Fcompose',
    'rru=addevent',
    `subject=${enc(subject)}`,
    `body=${enc(body)}`,
    `startdt=${enc(startISO)}`,
    `enddt=${enc(endISO)}`,
    `location=${enc(p.empresa||'')}`,
    'allday=false'
  ];
  if(p.email)parts.push(`to=${enc(p.email)}`);
  const url=`https://outlook.office.com/calendar/0/deeplink/compose?${parts.join('&')}`;
  window.open(url,'_blank','noopener');
}
function generateBriefing(){

  const {jsPDF}=window.jspdf;

  if(p.email)infoLines.push(['E-mail:',p.email]);
  if(p.telefone)infoLines.push(['Telefone:',p.telefone]);
  if(p.origem)infoLines.push(['Origem do lead:',p.origem]);

  infoLines.forEach(([k,v])=>{

  if(!p.bantT)sugestoes.push('• Verificar timing do projeto e urgência.');

function exportCSV(){

  const csv=[cols,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});

// Normaliza string: minúsculas, sem acentos, sem caracteres não alfanuméricos além de espaço.
// Permite busca "joao" encontrar "João", "industria" encontrar "Indústria", etc.
function normSearch(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')// remove diacríticos
    .replace(/[^\w\s@.-]/g,' ')// permite @, ., - (para e-mail e telefone); resto vira espaço
    .replace(/\s+/g,' ')
    .trim();
}
// Constrói o "haystack" concatenando todos os campos buscáveis do prospect.
function prospectHaystack(p){
  const partes=[
    p.nome,p.empresa,p.contato,p.email,p.telefone,
    p.origem,p.setor,p.porte,p.stage,p.notas,
    p.motivoDesqualificacao
  ];
  (p.contatosExtras||[]).forEach(c=>{
    partes.push(c.nome,c.cargo,c.email,c.telefone,c.role);
  });
  return normSearch(partes.filter(Boolean).join(' '));
}
function filtered(){
  // Busca multi-termo (cada palavra precisa aparecer) sobre todos os campos
  const terms=normSearch(filterSearch).split(' ').filter(Boolean);
  return prospects.filter(p=>{
    const matchS=!terms.length||(()=>{
      const hay=prospectHaystack(p);
      return terms.every(t=>hay.includes(t));
    })();
    const matchSt=!filterStage||p.stage===filterStage;
    const matchO=!filterOrigem||p.origem===filterOrigem;
    const matchD=showDesq?p.desqualificado:!p.desqualificado;
    return matchS&&matchSt&&matchO&&matchD;
  });
}

}

  const prefersDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const isDark=theme==='dark'||(theme==='auto'&&prefersDark);
  document.documentElement.classList.toggle('dark',isDark);
  document.documentElement.classList.toggle('light',theme==='light');
}
function toggleTheme(){
  const prefersDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const isDark=theme==='dark'||(theme==='auto'&&prefersDark);
  theme=isDark?'light':'dark';
  localStorage.setItem('crm_theme',theme);
  applyTheme();
  renderTopbar();
}

async function importExcel(input){
  const file=input.files[0];
  if(!file)return;
  if(typeof XLSX==='undefined'){toast('Biblioteca XLSX não carregada. Recarregue a página.','error');return}
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length){toast('Planilha vazia ou sem linhas de dados','error');return}
      // Normalização robusta: minúscula + remove acentos + remove caracteres não-alfanum
      // (usando Unicode escapes em vez de caracteres literais, que podem quebrar com encoding)
      const norm=s=>String(s||'')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g,'')
        .replace(/[^a-z0-9]/g,'');
      // findCol aceita tanto match EXATO quanto INCLUDES (mais tolerante)
      const findCol=(row,aliases)=>{
        const colKeys=Object.keys(row);
        const normalized=colKeys.map(k=>({orig:k,norm:norm(k)}));
        // 1ª tentativa: match exato
        for(const a of aliases){
          const hit=normalized.find(c=>c.norm===norm(a));
          if(hit)return hit.orig;
        }
        // 2ª tentativa: includes (ex: "Nome Completo" casa com "nome")
        for(const a of aliases){
          const hit=normalized.find(c=>c.norm.includes(norm(a)));
          if(hit)return hit.orig;
        }
        return null;
      };
      const sample=rows[0];
      const cols={
        colNome:findCol(sample,['nome','name','contato','responsavel','lead']),
        colEmpresa:findCol(sample,['empresa','company','razaosocial','cliente','organizacao']),
        colEmail:findCol(sample,['email','mail','correio']),
        colTelefone:findCol(sample,['telefone','fone','celular','whatsapp','tel','phone']),
        colCargo:findCol(sample,['cargo','funcao','titulo','posicao','role']),
        colSetor:findCol(sample,['setor','segmento','industria','industry','area']),
        colOrigem:findCol(sample,['origem','canal','source','fonte']),
        colNotas:findCol(sample,['notas','observacao','observacoes','comentario','notes','obs'])
      };
      if(!cols.colNome){
        const found=Object.keys(sample).slice(0,8).join(', ');
        toast(`Coluna "Nome" não encontrada. Colunas detectadas: ${found||'nenhuma'}`,'error');
        return;
      }
      _importData={rows,cols};
      openImportPreview();
    }catch(err){toast('Erro ao ler o arquivo: '+err.message,'error')}
  };
  reader.readAsArrayBuffer(file);
}

function allEvents(){

function monthKey(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`}
function monthLabel(d){return `${MESES_ABREV[d.getMonth()]}/${String(d.getFullYear()).slice(-2)}`}
const MESES_ABREV=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const LAST_STAGE=()=>STAGES[STAGES.length-1];
function computeMonthTotals(mKey){
  const evs=allEvents().filter(e=>e.data&&e.data.startsWith(mKey));
  const last=LAST_STAGE();
  return {
    leads:evs.filter(e=>e.tipo==='Criação').length,
    movs:evs.filter(e=>e.tipo==='Movimentação').length,
    inter:evs.filter(e=>['Nota','Ligação','E-mail','Reunião'].includes(e.tipo)).length,
    conv:evs.filter(e=>e.tipo==='Movimentação'&&e.texto&&e.texto.endsWith(`→ ${last}`)).length,
    response:evs.filter(e=>e.tipo==='Movimentação'&&e.texto&&e.texto.startsWith(`${STAGES[0]} →`)).length
  };
}
function computeByUser(mKey){
  const evs=allEvents().filter(e=>e.data&&e.data.startsWith(mKey));
  const last=LAST_STAGE();
  const users={};
  evs.forEach(e=>{
    const u=e.user||'Sistema';
    users[u]=users[u]||{leads:0,movs:0,inter:0,conv:0};
    if(e.tipo==='Criação')users[u].leads++;
    else if(e.tipo==='Movimentação'){users[u].movs++;if(e.texto&&e.texto.endsWith(`→ ${last}`))users[u].conv++}
    else users[u].inter++;
  });
  return users;
}
function computeStageVelocity(){
  const transitions={};
  prospects.forEach(p=>{
    const hist=(p.historico||[]).filter(h=>h.tipo==='Movimentação'||h.tipo==='Criação').slice().sort((a,b)=>(a.data+(a.hora||'00:00')).localeCompare(b.data+(b.hora||'00:00')));
    for(let i=0;i<hist.length-1;i++){
      const from=hist[i],to=hist[i+1];
      let fromStage;
      if(from.tipo==='Criação'){const mt=from.texto&&from.texto.match(/"([^"]+)"/);fromStage=mt?mt[1]:STAGES[0]}
      else{const parts=(from.texto||'').split('→').map(s=>s.trim());fromStage=parts[1]||parts[0]}
      const parts2=(to.texto||'').split('→').map(s=>s.trim());
      const toStage=parts2[1]||parts2[0];
      if(!fromStage||!toStage||fromStage===toStage)continue;
      // Só considera transições progressivas (para frente no funil)
      const fromIdx=STAGES.indexOf(fromStage);
      const toIdx=STAGES.indexOf(toStage);
      if(fromIdx<0||toIdx<0||toIdx<=fromIdx)continue;
      const d1=new Date(from.data+'T'+(from.hora||'00:00'));
      const d2=new Date(to.data+'T'+(to.hora||'00:00'));
      const days=(d2-d1)/86400000;
      if(days<0)continue;
      const key=`${fromStage} → ${toStage}`;
      transitions[key]=transitions[key]||[];
      transitions[key].push(days);
    }
  });
  // Ordenar por sequência natural do funil
  return Object.entries(transitions).map(([k,arr])=>{
    const fromStage=k.split('→')[0].trim();
    return {key:k,avg:arr.reduce((a,b)=>a+b,0)/arr.length,count:arr.length,order:STAGES.indexOf(fromStage)};
  }).sort((a,b)=>a.order-b.order);
}
function computeHeatmap(mKey){
  const grid=Array.from({length:7},()=>new Array(24).fill(0));
  const evs=mKey?allEvents().filter(e=>e.data&&e.data.startsWith(mKey)):allEvents();
  evs.forEach(e=>{
    if(!e.data)return;
    const d=parseYmd(e.data);
    const day=d.getDay();
    const hour=e.hora?parseInt(e.hora.split(':')[0]):9;
    if(!isNaN(hour)&&hour>=0&&hour<24)grid[day][hour]++;
  });
  return grid;
}
function computeDormant(){
  const now=new Date();
  return prospects.map(p=>{
    if(p.desqualificado)return null;
    const hist=(p.historico||[]).slice().sort((a,b)=>(b.data+(b.hora||'')).localeCompare(a.data+(a.hora||'')));
    if(!hist.length)return null;
    const last=hist[0];
    const lastDate=new Date(last.data+'T'+(last.hora||'00:00'));
    const daysStuck=Math.floor((now-lastDate)/86400000);
    if(daysStuck>=14&&p.stage!==LAST_STAGE())return {p,daysStuck};
    return null;
  }).filter(Boolean).sort((a,b)=>b.daysStuck-a.daysStuck);
}
function computeAgentInsights(){
  const all=prospects;
  const done=STAGES[STAGES.length-1],firstActive=STAGES[1]||done;
  const today0=parseYmd(today());
  const activeStages=STAGES.slice(1,-1);
  const norm=s=>(s||'').trim().toLowerCase();
  const typeKey=p=>norm(p.setor)||norm(p.origem)||'(sem tipo)';
  const typeLabel=p=>(p.setor&&p.setor.trim())||(p.origem&&p.origem.trim())||'(sem tipo)';
  const avg=arr=>arr.length?Math.round(arr.reduce((s,x)=>s+x,0)/arr.length):null;
  function cycleOf(p){
    const tl=stageTimeline(p);
    const de=tl.filter(x=>x.stage===done).map(x=>x.enteredAt).filter(Boolean).sort((a,b)=>a-b)[0];
    if(!de)return null;
    const ae=tl.filter(x=>x.stage===firstActive).map(x=>x.enteredAt).filter(Boolean).sort((a,b)=>a-b)[0];
    const created=isYmd(p.criadoEm)?parseYmd(p.criadoEm):(tl[0]&&tl[0].enteredAt);
    const ref=ae||created;return ref?daysBetween(ref,de):null;
  }
  const groups={};
  all.forEach(p=>{
    const k=typeKey(p);

function taskDateRange(p){
  const ini=isYmd(p.telefone)?p.telefone:null;
  const fim=isYmd(p.proximoContato)?p.proximoContato:null;
  if(!ini&&!fim)return [];
  if(ini&&fim){
    let d=parseYmd(ini),end=parseYmd(fim);
    if(d>end){const tmp=d;d=end;end=tmp;}
    const out=[];let g=0;
    while(d<=end&&g<400){out.push(ymd(d));d.setDate(d.getDate()+1);g++;}
    return out;
  }
  return [fim||ini];
}

    const cellYmd=ymd(d);
    const evts=eventMap[cellYmd]||[];
    head+=`<div>${DIAS[d.getDay()]} ${pad2(d.getDate())}/${pad2(d.getMonth()+1)}</div>`;
    grid+=`<div class="cal-cell${cellYmd===tYmd?' today':''}${(i===0||i===6)?' weekend':''}" style="min-height:420px" onclick="agendaNewAt('${cellYmd}')">
      <div class="cal-day">${d.getDate()}</div>
      <div style="display:flex;flex-direction:column;gap:6px;overflow:hidden">${evts.map(agendaWeekCard).join('')}</div>
    </div>`;
  }
  area.innerHTML=`<div class="cal-month"><div class="cal-head">${head}</div><div class="cal-grid" style="grid-auto-rows:auto">${grid}</div></div>`;
}

function renderAgendaList(){
  const area=document.getElementById('agenda-body');
  const t=new Date();const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const evts=prospects.filter(p=>p.proximoContato).map(p=>({p,d:parseYmd(p.proximoContato)})).sort((a,b)=>{
    const da=a.p.proximoContato+' '+(a.p.horaContato||'00:00');
    const db=b.p.proximoContato+' '+(b.p.horaContato||'00:00');
    return da.localeCompare(db);
  });
  const groups={};
  evts.forEach(({p,d})=>{
    const diff=Math.floor((d-t0)/86400000);
    let key;
    if(diff<0)key='Atrasados';
    else if(diff===0)key='Hoje';
    else if(diff===1)key='Amanhã';
    else if(diff<=7)key='Esta semana';
    else if(diff<=30)key='Próximos 30 dias';
    else key='Mais tarde';
    (groups[key]=groups[key]||[]).push({p,d,diff});
  });
  const order=['Atrasados','Hoje','Amanhã','Esta semana','Próximos 30 dias','Mais tarde'];
  let html='';
  order.forEach(key=>{
    if(!groups[key])return;
    html+=`<div class="agenda-group"><div class="agenda-group-title">${key}<span class="count">${groups[key].length}</span></div>`;
    groups[key].forEach(({p,d,diff})=>{
      const dayName=DIAS[d.getDay()];
      const dateStr=`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`;
      html+=`<div class="agenda-item${diff<0?' late':''}" style="--c:${stageColor(p.stage)};background:${hex2rgba(stageColor(p.stage),0.07)};border-left-color:${stageColor(p.stage)}" onclick="openEdit('${p.id}')">
        <div class="agenda-when">
          <div class="agenda-date">${dateStr}</div>
          <div class="agenda-time">${dayName}${p.horaContato?' · '+esc(p.horaContato):''}</div>
        </div>
        <div class="agenda-body" style="display:flex;align-items:center;gap:9px">
          <div class="card-avatar ${avColor(p.id,p.origem)}" title="Responsável: ${esc(p.contato||'—')}">${esc(initials(p.contato||p.nome))}</div>
          <div style="min-width:0">
            <div class="agenda-name">${esc(p.setor)||'—'}</div>
            <div class="agenda-empresa">${esc(p.empresa)||'—'}</div>
          </div>
        </div>
        <span class="badge dyn" style="--c:${stageColor(p.stage)};--c-bg:${hex2rgba(stageColor(p.stage),0.12)}">${esc(p.stage)}</span>
      </div>`;
    });
    html+=`</div>`;
  });
  if(!evts.length)html=`<div class="empty" style="padding:3rem"><span>Nenhuma tarefa agendada. Clique em <b>Nova Tarefa</b> para adicionar.</span></div>`;
  area.innerHTML=html;
}

function saveSettings(){
  const oldNames=stagesConfig.map(s=>s.name);
  stagesConfig.forEach((s,i)=>{
    const ni=document.getElementById('cfg-stage-name-'+i);
    const ci=document.getElementById('cfg-stage-color-'+i);
    if(ni&&ni.value.trim())s.name=ni.value.trim();
    if(ci)s.color=ci.value;
    s.short=s.name;
  });
  const newNames=stagesConfig.map(s=>s.name);
  const map={};oldNames.forEach((o,i)=>{if(o!==newNames[i])map[o]=newNames[i]});
  if(Object.keys(map).length)prospects.forEach(p=>{if(map[p.stage])p.stage=map[p.stage]});
  refreshStages();
  const eT=document.getElementById('cfg-entregaveis');
  const rT=document.getElementById('cfg-responsaveis');
  if(eT)entregaveisConfig=eT.value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(rT)responsaveisConfig=rT.value.split('\n').map(x=>x.trim()).filter(Boolean);
  settingsDirty=false;
  Promise.allSettled([saveStagesConfig(),saveEntregaveisConfig(),saveResponsaveisConfig()]).then(()=>{
    if(Object.keys(map).length){Promise.allSettled(prospects.filter(p=>true).map(p=>dbPatch(p.id,{stage:p.stage}).catch(()=>{})));}
    toast('Configurações salvas');
    renderFull();
  });
}

async function commitStageChanges(){
  const names=editStages.map(s=>(s.name||'').trim());
  if(names.some(n=>!n)){toast('Todas as etapas precisam de nome','error');return}
  if(new Set(names).size!==names.length){toast('Nao pode haver nomes de etapa repetidos','error');return}
  const oldNames=stagesConfig.map(s=>s.name);
  const newNames=editStages.map(s=>s.name);
  const mapped={};
  oldNames.forEach((n,i)=>{
    if(newNames.includes(n)){mapped[n]=n}
    else if(newNames[i]){mapped[n]=newNames[i]}
    else{mapped[n]=newNames[Math.max(0,Math.min(i-1,newNames.length-1))]||newNames[0]}
  });
  const toUpdate=prospects.filter(p=>mapped[p.stage]&&mapped[p.stage]!==p.stage);
  const prevStagesConfig=JSON.parse(JSON.stringify(stagesConfig));
  const prevProspects=prospects.map(p=>({...p}));
  const originalStages=new Map(toUpdate.map(p=>[p.id,p.stage]));
  const patched=[];
  try{
    stagesConfig=JSON.parse(JSON.stringify(editStages));refreshStages();
    await saveStagesConfig();
    for(const p of toUpdate){
      const newStage=mapped[p.stage];
      await dbPatch(p.id,{stage:newStage});
      p.stage=newStage;
      patched.push(p.id);
    }
    localStorage.setItem('crm_v2',JSON.stringify(prospects));
    settingsDirty=false;
    toast('Pipeline atualizado');
    renderSidebar();renderTopbar();renderSettings();
  }catch(e){
    console.error('[commitStageChanges] falhou, rollback:',e);
    try{
      for(const pid of patched){
        const original=originalStages.get(pid);
        if(original)await dbPatch(pid,{stage:original}).catch(()=>{});
      }
    }catch{}
    stagesConfig=prevStagesConfig;refreshStages();
    prospects=prevProspects;
    try{await saveStagesConfig()}catch{}
    localStorage.setItem('crm_v2',JSON.stringify(prospects));
    settingsDirty=false;
    renderSidebar();renderTopbar();renderSettings();
    if(!handleAuthError(e))toast('Erro ao salvar - alteracoes desfeitas: '+e.message,'error');
  }
}

function stageTimeline(p){
  const movs=(p.historico||[]).filter(h=>h.tipo==='Movimentação'&&h.texto&&h.texto.includes('→')).map(h=>{
    const parts=h.texto.split('→');const from=(parts[0]||'').trim();const to=(parts[1]||'').trim();
    const d=isYmd((h.data||'').slice(0,10))?parseYmd(h.data.slice(0,10)):null;
    return {from,to,date:d};
  }).filter(m=>m.date).sort((a,b)=>a.date-b.date);
  const created=isYmd(p.criadoEm)?parseYmd(p.criadoEm):(movs[0]?movs[0].date:null);
  const tl=[];
  if(movs.length){tl.push({stage:movs[0].from,enteredAt:created||movs[0].date});movs.forEach(m=>tl.push({stage:m.to,enteredAt:m.date}));}
  else tl.push({stage:p.stage,enteredAt:created});
  return tl;
}
function computeFlowKPIs(){
  const all=prospects;
  const backlog=STAGES[0],done=STAGES[STAGES.length-1];
  const activeStages=STAGES.slice(1,-1);const firstActive=STAGES[1]||done;
  const today0=parseYmd(today());
  const cutoff=new Date(today0);cutoff.setDate(today0.getDate()-30);
  const byStage={};STAGES.forEach(s=>byStage[s]=all.filter(p=>p.stage===s).length);
  const wip=activeStages.reduce((s,st)=>s+(byStage[st]||0),0);
  const lead=[],cycle=[];let thr30=0,onTime=0,doneWithFim=0;
  const colDur={};STAGES.forEach(s=>colDur[s]=[]);
  const wipAging=[];
  all.forEach(p=>{
    const tl=stageTimeline(p);
    for(let i=0;i<tl.length;i++){const start=tl[i].enteredAt;const end=(i+1<tl.length)?tl[i+1].enteredAt:today0;if(start&&end){const d=daysBetween(start,end);if(d>=0&&colDur[tl[i].stage])colDur[tl[i].stage].push(d);}}
    const doneEntry=tl.filter(x=>x.stage===done).map(x=>x.enteredAt).filter(Boolean).sort((a,b)=>a-b)[0];
    const created=isYmd(p.criadoEm)?parseYmd(p.criadoEm):(tl[0]&&tl[0].enteredAt);
    const actEntry=tl.filter(x=>x.stage===firstActive).map(x=>x.enteredAt).filter(Boolean).sort((a,b)=>a-b)[0];
    if(p.stage===done&&doneEntry){
      if(created)lead.push(daysBetween(created,doneEntry));
      if(actEntry)cycle.push(daysBetween(actEntry,doneEntry));else if(created)cycle.push(daysBetween(created,doneEntry));
      if(doneEntry>=cutoff)thr30++;
      if(isYmd(p.proximoContato)){doneWithFim++;if(doneEntry<=parseYmd(p.proximoContato))onTime++;}
    }
    if(activeStages.includes(p.stage)){const enter=tl.filter(x=>x.stage===p.stage).map(x=>x.enteredAt).filter(Boolean).sort((a,b)=>b-a)[0]||created;if(enter)wipAging.push({p,age:daysBetween(enter,today0)});}
  });
  wipAging.sort((a,b)=>b.age-a.age);
  const avg=arr=>arr.length?Math.round(arr.reduce((s,x)=>s+x,0)/arr.length):null;
  const arr30=all.filter(p=>isYmd(p.criadoEm)&&parseYmd(p.criadoEm)>=cutoff).length;
  const colAgingAvg={};STAGES.forEach(s=>colAgingAvg[s]=avg(colDur[s]));
  return {byStage,wip,backlog,done,activeStages,total:all.length,completed:byStage[done],
    leadAvg:avg(lead),leadP50:pctile(lead,50),leadP85:pctile(lead,85),leadN:lead.length,
    cycleAvg:avg(cycle),cycleP50:pctile(cycle,50),cycleP85:pctile(cycle,85),cycleN:cycle.length,
    thr30,onTime,doneWithFim,arr30,colAgingAvg,wipAging};
}

      <div class="metric m-stages"><div class="metric-accent"></div><div class="metric-icon mi-stages">${ICONS.layers}</div><div class="metric-body"><div class="metric-label">Ticket médio</div><div class="metric-value sm">${fmt(avgVal)}</div><div class="metric-sub">por prospecto</div></div></div>
      <div class="metric m-today"><div class="metric-accent"></div><div class="metric-icon mi-today">${ICONS.clock}</div><div class="metric-body"><div class="metric-label">Conversão</div><div class="metric-value">${convRate}%</div><div class="metric-sub">→ ${wonStage}</div></div></div>
    </div>
    ${(()=>{
      const tYmd=today();
      const dayTot=computePeriodTotals(tYmd,tYmd);
      const wkStart=weekStartYmd(),wkEnd=weekEndYmd();
      const wkTot=computePeriodTotals(wkStart,wkEnd);
      const mStart=monthKey(new Date())+'-01',mEnd=today();
      const mTot=computePeriodTotals(mStart,mEnd);
      const barColor=(cur,goal)=>cur>=goal?'over':(cur/goal<0.5?'low':'');
      const renderBar=(label,cur,goal,ca,cb)=>{
        const pct=goal?Math.min(100,Math.round(cur/goal*100)):0;
        return `<div class="goal-row" style="--gc-a:${ca};--gc-b:${cb};padding:7px 0">
          <div class="goal-label" style="min-width:88px;font-size:11.5px">${label}</div>
          <div class="goal-bar-wrap" style="height:10px"><div class="goal-bar ${barColor(cur,goal)}" style="width:${pct}%"></div></div>
          <div class="goal-val" style="min-width:84px;font-size:11.5px">${cur} / ${goal}<span class="goal-pct">${pct}%</span></div>
        </div>`;
      };
      const wkLabel=`${wkStart.split('-').reverse().slice(0,2).join('/')} — ${wkEnd.split('-').reverse().slice(0,2).join('/')}`;
      return `<div class="chart-card" style="margin-top:14px">
        <div class="chart-card-title">Ritmo de prospecção</div>
        <div class="chart-card-sub">Progresso contra suas metas · edite em <b>Configurações</b></div>
        <div class="dash-grid" style="margin-top:14px;gap:18px">
          <div>
            <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;display:flex;align-items:center;gap:8px">Hoje <span style="background:var(--surface2);color:var(--text3);padding:2px 9px;border-radius:99px;font-size:10.5px">${tYmd.split('-').reverse().slice(0,2).join('/')}</span></div>
            ${renderBar('Novos Leads',dayTot.leads,goalsConfig.leads_day,'#E30613','#FF6B7A')}
            ${renderBar('Interações',dayTot.inter,goalsConfig.inter_day,'#D97706','#FCD34D')}
          </div>
          <div>
            <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;display:flex;align-items:center;gap:8px">Esta semana <span style="background:var(--surface2);color:var(--text3);padding:2px 9px;border-radius:99px;font-size:10.5px">${wkLabel}</span></div>
            ${renderBar('Novos Leads',wkTot.leads,goalsConfig.leads_week,'#E30613','#FF6B7A')}
            ${renderBar('Conversões',wkTot.conv,goalsConfig.conv_week,'#16A34A','#6EE7B7')}
            ${renderBar('Interações',wkTot.inter,goalsConfig.inter_week,'#D97706','#FCD34D')}
          </div>
        </div>
      </div>`;
    })()}
    <div class="dash-grid">
      <div class="chart-card">
        <div class="chart-card-title">Funil de Conversão</div>
        <div class="chart-card-sub">Quantidade de prospectos por etapa</div>
        <div class="chart-canvas-wrap"><canvas id="chart-funnel"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Pipeline por Etapa</div>
        <div class="chart-card-sub">Valor estimado em R$ acumulado</div>
        <div class="chart-canvas-wrap"><canvas id="chart-value"></canvas></div>
      </div>
    </div>
    ${(()=>{
      const sugs=computeSuggestions();
      if(!sugs.length)return '';
      const prioConfig={3:{color:'#DC2626',bg:'rgba(220,38,38,0.08)',label:'URGENTE'},2:{color:'#D97706',bg:'rgba(217,119,6,0.08)',label:'IMPORTANTE'},1:{color:'#16A34A',bg:'rgba(22,163,74,0.08)',label:'OPORTUNIDADE'}};
      const tipoIcon={cadencia:'⚡',dormente:'💤',qualificar:'🎯',avancar:'🚀',agendado:'📅'};
      return `<div class="chart-card" style="margin-top:14px">
        <div class="chart-card-title">Ações sugeridas para hoje</div>
        <div class="chart-card-sub">${sugs.length} sugestão${sugs.length!==1?'ões':''} baseada${sugs.length!==1?'s':''} em cadência, dormentes e qualificação</div>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
          ${sugs.map(s=>{const pc=prioConfig[s.prioridade];return `<div onclick="openEdit('${s.p.id}')" style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:${pc.bg};border:1px solid ${pc.color};border-left-width:3px;border-radius:var(--radius);cursor:pointer;transition:all 0.15s" onmouseover="this.style.transform='translateX(2px)'" onmouseout="this.style.transform=''">
            <div style="font-size:18px;flex-shrink:0">${tipoIcon[s.tipo]||'•'}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--text);line-height:1.3">${esc(s.p.nome)}${s.p.empresa?` <span style="color:var(--text3);font-weight:400">· ${esc(s.p.empresa)}</span>`:''}</div>
              <div style="font-size:12px;color:var(--text2);margin-top:2px">${esc(s.msg)} <span style="color:${pc.color};font-weight:600">· ${esc(s.sub)}</span></div>
            </div>
            <div style="font-size:9.5px;font-weight:700;color:${pc.color};background:${pc.bg};padding:3px 8px;border-radius:99px;letter-spacing:0.5px;flex-shrink:0">${pc.label}</div>
          </div>`}).join('')}
        </div>
      </div>`;
    })()}
    <div class="chart-card" style="margin-top:14px">
      <div class="chart-card-title">Próximos Contatos</div>
      <div class="chart-card-sub">Atrasados, hoje e próximos 14 dias</div>
      <div id="upcoming-list" style="margin-top:6px">${upcoming.length?upcoming.map(p=>{
        const ds=dateStatus(p.proximoContato);
        const lbl=ds==='late'?'Atrasado':(ds==='today'?'Hoje':fmtDate(p.proximoContato));
        return `<div class="upcoming-row" onclick="openEdit('${p.id}')">
          <div class="upcoming-when ${ds==='late'?'late':(ds==='today'?'today':'')}">${lbl}${p.horaContato?'<br>'+p.horaContato:''}</div>
          <div class="upcoming-info"><div class="upcoming-name">${esc(p.nome)}</div><div class="upcoming-empresa">${esc(p.empresa)||'—'}</div></div>
          <span class="badge dyn" style="--c:${stageColor(p.stage)};--c-bg:${hex2rgba(stageColor(p.stage),0.12)}">${esc(p.stage)}</span>
        </div>`;
      }).join(''):'<div class="empty" style="padding:2rem"><span>Nenhum contato agendado nos próximos 14 dias</span></div>'}</div>
    </div>
    <div class="chart-card" style="margin-top:14px">
      <div class="chart-card-title">Atividade Recente</div>
      <div class="chart-card-sub">Últimas 15 movimentações, criações e interações</div>
      <div style="margin-top:6px">${renderActivityFeed()}</div>
    </div>
  `;

  dashCharts.forEach(c=>{try{c.destroy()}catch{}});dashCharts=[];
  if(typeof Chart==='undefined')return;
  const commonOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1A1917',padding:10,cornerRadius:8}},scales:{x:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:11}}},y:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:11}},beginAtZero:true}}};
  setTimeout(()=>{
    const c1=document.getElementById('chart-funnel');
    if(c1)dashCharts.push(new Chart(c1,{type:'bar',data:{labels:STAGES,datasets:[{data:stageCounts,backgroundColor:stageColors,borderRadius:8,barThickness:42}]},options:{...commonOpts,indexAxis:'y',scales:{x:{...commonOpts.scales.x,ticks:{...commonOpts.scales.x.ticks,precision:0}},y:{...commonOpts.scales.y,grid:{display:false}}}}}));
    const c2=document.getElementById('chart-value');
    if(c2)dashCharts.push(new Chart(c2,{type:'bar',data:{labels:STAGES.map(s=>stageShort(s)),datasets:[{data:stageVals,backgroundColor:stageColors,borderRadius:8,barThickness:42}]},options:{...commonOpts,scales:{x:{...commonOpts.scales.x,grid:{display:false}},y:{...commonOpts.scales.y,ticks:{...commonOpts.scales.y.ticks,callback:v=>'R$ '+(v>=1000?(v/1000).toFixed(0)+'k':v)}}}}}));
  },30);
}

function renderContent(){
  const area=document.getElementById('content-area');
  if(!area)return;
  const vis=filtered();
  let html='';
  if(view==='kanban'){
    html+=`<div class="kanban">`;
    // Flex-grow proporcional à quantidade de cards (0.6..2.5)
    const countsByStage=STAGES.map(s=>vis.filter(p=>p.stage===s).length);
    const totalCards=Math.max(1,countsByStage.reduce((a,b)=>a+b,0));
    const flexFor=cnt=>Math.min(2.5,Math.max(0.6,(cnt/totalCards)*STAGES.length));
    STAGES.forEach((stage,si)=>{
      const cards=vis.filter(p=>p.stage===stage);
      const grow=flexFor(cards.length);
      const stColor=stageColor(stage);
      html+=`<div class="col" data-stage="${esc(stage)}" style="flex:1 1 0;border-top:3px solid ${stColor}" ondragover="dragOver(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="dropOnColEl(event,this)">
        <div class="col-head" data-tip="${esc(stageDesc(stage))}">
          <span class="col-dot" style="${dotStyle(stage)}"></span>
          <span class="col-name">${esc(stage)}</span>
          <span class="col-count" style="background:${hex2rgba(stColor,0.14)};color:${stColor};border-color:${hex2rgba(stColor,0.3)}">${cards.length}</span>
        </div>`;
      if(!cards.length){
        html+=`<div class="empty-col">${ICONS.empty}<span>Nenhum prospecto</span></div>`;
      } else {
        cards.forEach(p=>{
          const ds=dateStatus(p.proximoContato);
          const dl=dateLabel(p.proximoContato);
          const av=avColor(p.id,p.origem);
          const hl=(p.historico||[]).length;
          // Card compacto: apenas avatar + nome + empresa visíveis.
          // Todos os detalhes (valor, data, BANT, badges, mover etapa, etc.) continuam
          // acessíveis ao abrir o modal. Drag-and-drop entre colunas segue funcionando.
          // title= mostra tooltip com os dados extras no hover, sem poluir visual.
          const tip=[p.nome?`Projeto: ${p.nome}`:null,p.contato?`Resp.: ${p.contato}`:null,dl||'Sem data',p.porte||null].filter(Boolean).join(' · ');
          html+=`<div class="card card-compact" data-card-id="${p.id}" draggable="true" style="--card-c:${stageColor(p.stage)}" ondragstart="dragStart(event,'${p.id}')" ondragend="dragEnd(event)" onclick="openEdit('${p.id}')" title="${esc(tip)}">
            <div class="card-header">
              <div class="card-avatar ${av}" title="Responsável: ${esc(p.contato||'—')}">${esc(initials(p.contato||p.nome))}</div>
              <div class="card-info">
                <div class="card-name">${esc(p.setor)||'—'}</div>
                <div class="card-empresa">${esc(p.empresa)||'—'}</div>
              </div>
              ${p.desqualificado?`<span class="card-badge-desq" title="${esc(p.motivoDesqualificacao||'Desqualificado')}">✕</span>`:''}
            </div>
          </div>`;
        });
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  } else {
    STAGES.forEach((st,sidx)=>{
      const rows=vis.filter(p=>p.stage===st);
      const col=stageColor(st);
      html+=`<div class="list-group" data-stage="${esc(st)}" ondragover="dragOver(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="dropOnColEl(event,this)" style="margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:9px;padding:10px 4px 9px;border-bottom:2px solid ${col};margin-bottom:2px">
          <span style="width:9px;height:9px;border-radius:50%;background:${col}"></span>
          <span style="font-size:14px;font-weight:600;color:var(--text)">${esc(st)}</span>
          <span style="font-size:11px;font-weight:700;background:var(--surface2);color:var(--text2);border-radius:99px;padding:2px 9px">${rows.length}</span>
        </div>`;
      if(!rows.length){
        html+=`<div style="padding:14px 6px;color:var(--text3);font-size:12.5px">Nenhuma tarefa nesta coluna — arraste uma tarefa para cá</div>`;
      } else {
        html+=`<div class="table-wrap"><table>
          <thead><tr>
            <th>Projeto</th><th>Cliente</th><th>Responsável</th><th>Prioridade</th><th>Prazo</th>
          </tr></thead><tbody>`;
        rows.forEach(p=>{
          const ds=dateStatus(p.proximoContato);
          const dl=dateLabel(p.proximoContato);
          const pcor=p.porte==='Alta'?'#DC2626':(p.porte==='Media'?'#D97706':'#16A34A');
          html+=`<tr data-card-id="${p.id}" draggable="true" ondragstart="dragStart(event,'${p.id}')" ondragend="dragEnd(event)" onclick="openEdit('${p.id}')">
            <td><div style="display:flex;align-items:center;gap:9px">
              <div class="card-avatar ${avColor(p.id,p.origem)}" style="width:30px;height:30px;font-size:11px;border-radius:8px">${esc(initials(p.nome))}</div>
              <span class="td-name">${esc(p.nome)}</span>
            </div></td>
            <td class="td-company">${esc(p.empresa)||'—'}</td>
            <td>${esc(p.contato)||`<span style="color:var(--text3);font-size:12px">—</span>`}</td>
            <td>${p.porte?`<span class="badge dyn" style="--c:${pcor};--c-bg:${hex2rgba(pcor,0.12)}">${esc(p.porte)}</span>`:`<span style="color:var(--text3);font-size:12px">—</span>`}</td>
            <td>${dl?`<span class="date-badge date-${ds}">${esc(dl)}</span>`:`<span style="color:var(--text3);font-size:12px">—</span>`}</td>
          </tr>`;
        });
        html+=`</tbody></table></div>`;
      }
      html+=`</div>`;
    });
    if(!vis.length){
      html+=`<div style="text-align:center;padding:2rem;color:var(--text3)"><div style="display:flex;flex-direction:column;align-items:center;gap:8px">${ICONS.empty}<span>Nenhuma tarefa encontrada</span></div></div>`;
    }
  }
  area.innerHTML=html;
}

async function init(){
  document.getElementById('app').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:40vh;gap:10px;color:var(--text3);font-size:14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Carregando dados...</div>`;
  await loadStagesConfig();
  await loadOrigensConfig();
  await loadMotivosConfig();
  await loadIcpConfig();
  await loadTemplatesConfig();
  await loadSignatureConfig();
  await loadCadenciaConfig();
  await loadGoalsConfig();
  await loadEntregaveisConfig();
  await loadResponsaveisConfig();
  prospects=await dbFetch();
  renderFull();
}
async function bootstrap(){
  const {data}=await sb.auth.getSession();
  session=data.session||null;
  if(session){showApp()}else{showLogin()}
  sb.auth.onAuthStateChange((_e,s)=>{
    session=s||null;
    if(!s&&document.getElementById('app-shell')?.style.display==='flex'){
      try{showLogin()}catch{}
    }
  });
}

// Registro do Service Worker (PWA)
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .catch(err=>console.warn('[SW] registro falhou:',err));
  });
}

bootstrap();
</script>
</body>
</html>
